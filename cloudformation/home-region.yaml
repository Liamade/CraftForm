#╔══════════════════════════════════════════════════════════════════════════════╗
#║                               CraftForm                                      ║
#╠══════════════════════════════════════════════════════════════════════════════╣
#║  CLOUDFORMATION  ::  home-region.yaml                                        ║
#║  Handles the CloudFormation Custom Resource response.                        ║
#║  Signals deployment success or failure back to CloudFormation.               ║
#╚══════════════════════════════════════════════════════════════════════════════╝

AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Develops and provisions the CraftForm home region (home base) that all infrastructure and resources are deployed/managed from. This also sets up the connection and integration with Discord, as well as the CodeBuild project that runs Terraform for region deploys.

#====================================================================================================================
#                                                 PARAMETERS
#====================================================================================================================
# set of necessary parameters for the home region setup - comes from the user input during stack creation
#--------------------------------------------------------------------------------------------------------------------
Parameters:

  # release version of the code use for the Lambda functions
  CraftFormVersion:
    Type: String
    Default: latest
    Description: The version of the CraftForm code to deploy (e.g., "v1.0.0" or "latest"). This is used to stage the correct Lambda code from the GitHub releases.
  # discord parameters for the CraftForm bot
  DiscordAppId:
    Type: String
    Description: The Discord Application ID for the CraftForm bot.
    NoEcho: true # Hide the value in the CloudFormation console for security
  DiscordPublicKey:
    Type: String
    Description: The Discord Public Key for verifying interactions from Discord.
    NoEcho: true # Hide the value in the CloudFormation console for security
  DiscordBotToken:
    Type: String
    Description: The Discord Bot Token for authenticating the CraftForm bot with Discord.
    NoEcho: true # Hide the value in the CloudFormation console for security

#====================================================================================================================
#                                                 RESOURCES
#====================================================================================================================
# set of necessary resources for the home region setup - develops the home region for the discord integration,
# and the necessary infrastructure for the CraftForm bot to operate in the home region
#--------------------------------------------------------------------------------------------------------------------

Resources:

# ------------------------------------------IAM ROLES------------------------------------------
  # REGION BUILD ROLE -- the role the region CodeBuild project runs terraform under.
  # this is the exact same permission set the old github actions role carried, just handed to
  # codebuild instead -- no OIDC provider, no federation, no long-lived keys anywhere :)
  CodeBuildRegionRole:
    Type: AWS::IAM::Role
    Properties:
      # tags
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion
      RoleName: craftform-region-build # Name of the IAM role the region builds run as
      AssumeRolePolicyDocument:
        # who is allowed to assume this role - the CodeBuild service
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com # only codebuild can assume this
            Action: sts:AssumeRole
            Condition:
              # confused-deputy guard -- codebuild can only assume this on behalf of THIS account
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

      Policies:
        # inline policies for the role - permissions that the role has
        - PolicyName: craftform-region-build-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ======================= provision =======================
              # the create calls, plus the tag-on-create calls that ride along with them.
              # these CAN'T be tag-scoped: a brand-new resource has no tags yet, so the
              # "manage tagged stuff" statement below can't authorize its birth -- chicken n egg.
              - Sid: Provision
                Effect: Allow
                Action:
                  # --- s3 world-data bucket + its settings ---
                  - s3:CreateBucket
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:PutEncryptionConfiguration
                  # --- vpc, subnets, igw, routes, endpoint, security groups ---
                  - ec2:CreateVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:CreateRoute
                  - ec2:AssociateRouteTable
                  - ec2:CreateVpcEndpoint
                  - ec2:CreateSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:CreateTags
                  # --- the ec2 server role + its instance profile ---
                  - iam:CreateRole
                  - iam:TagRole
                  - iam:PutRolePolicy
                  - iam:CreatePolicy
                  - iam:CreateInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:AttachRolePolicy
                  - iam:PassRole
                Resource: '*'

              # ======================= read-only =======================
              # every plan refreshes state by reading each resource back. tons of these are
              # list/describe-style actions AWS only accepts on '*' (can't be tag- or arn-
              # scoped), and freshly-made resources aren't tagged yet anyway. read-only so
              # it's safe to allow broadly :)  -- this also covers reading the tf state object
              # and listing the home bucket, so neither needs its own statement anymore.
              - Sid: ReadOnly
                Effect: Allow
                Action:
                  - s3:Get*
                  - s3:List*
                  - iam:Get*
                  - iam:List*
                  - ec2:Describe*
                  - ssm:DescribeParameters
                Resource: '*'

              # ======================= manage tagged resources =======================
              # once a resource exists and carries Project=craftform, terraform can do
              # anything to it (modify / destroy). this is the blast-radius guard -- the role
              # can't touch a single thing that isn't ours.
              - Sid: ManageTaggedResources
                Effect: Allow
                Action: '*'
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform

              # ======================= terraform state backend =======================
              # state lives as OBJECTS in the home bucket, and objects don't inherit the
              # bucket's craftform tag -- so the tag statement can't reach them. the reads are
              # already handled by ReadOnly above, so this just grants the writes.
              - Sid: TerraformState
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::craftform-home-${AWS::AccountId}/regions/*

              # ======================= ssm params =======================
              # write (and the rest of) the per-region config params terraform publishes.
              # DescribeParameters is the one ssm read that needs '*', so it lives in ReadOnly.
              - Sid: SsmParameters
                Effect: Allow
                Action: ssm:*
                Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/craftform/*

              # ======================= delete world buckets =======================
              # s3 bucket-level actions DON'T honor aws:ResourceTag, so ManageTaggedResources
              # above can't authorize a bucket delete (it fails closed) -- gotta grant
              # DeleteBucket explicitly, scoped by name to the per-region world buckets.
              - Sid: DeleteWorldBuckets
                Effect: Allow
                Action: s3:DeleteBucket
                Resource: !Sub arn:aws:s3:::craftform-*-${AWS::AccountId}

              # ======================= protect the state bucket =======================
              # the home bucket matches the glob above AND is tagged craftform, so it's
              # technically in reach of the deletes -- nuking it would destroy our own tf
              # state. explicit Deny beats every Allow, so this slams that door shut for good.
              - Sid: ProtectStateBucket
                Effect: Deny
                Action: s3:DeleteBucket
                Resource: !Sub arn:aws:s3:::craftform-home-${AWS::AccountId}

              # ======================= build logs =======================
              # github used to keep the logs for us -- now the build writes its own terraform
              # output into cloudwatch, which is the only place to go digging when a run fails
              - Sid: BuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/codebuild/craftform-*:*

  # SERVER BUILD ROLE -- the role the server CodeBuild project bakes under.
  # deliberately NOT the region role. that one can do anything tagged Project=craftform,
  # and every player's running server carries that tag -- so a bad bake could reach a live
  # world. this role can only touch things IT made, which is what Role=builder is for :)
  #
  # the bake writes the software onto a scratch EBS volume and snapshots THAT, instead of
  # CreateImage-ing the builder. a ~1gb snapshot beats an 8gb root snapshot by a mile, and
  # that wait is the whole reason create feels slow to the user.
  CodeBuildServerRole:
    Type: AWS::IAM::Role
    Properties:
      # tags
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion
      RoleName: craftform-server-build # Name of the IAM role the server bakes run as
      AssumeRolePolicyDocument:
        # who is allowed to assume this role - the CodeBuild service
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com # only codebuild can assume this
            Action: sts:AssumeRole
            Condition:
              # confused-deputy guard -- same deal as the region role
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

      Policies:
        # inline policies for the role - permissions that the role has
        - PolicyName: craftform-server-build-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ======================= read-only =======================
              # DescribeImages is the cache check at the top of every bake ("do we already
              # have this version?"), and the rest is just polling -- is the builder up, is
              # the volume attached, is the snapshot done yet. ec2 describes ONLY accept '*'
              # (no arn scoping, no tag scoping), and they're read-only, so this is the safe
              # kind of broad :)
              - Sid: ReadOnly
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ssm:DescribeParameters
                Resource: '*'

              # ======================= the build's own source =======================
              # codebuild pulls the zip itself, but it does it AS this role -- so without
              # this the project can't even read its own buildspec :(
              - Sid: BuildSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:aws:s3:::craftform-home-${AWS::AccountId}/lambda-code/*

              # ======================= launch the builder =======================
              # RunInstances touches a pile of resource types at once and only the INSTANCE
              # and the volumes carry our request tags -- the image/subnet/sg arns can't, so
              # conditioning the whole action fails closed. that's why it's split in two.
              - Sid: LaunchBuilderPlumbing
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - arn:aws:ec2:*::image/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*

              # the half that CAN be tagged -- so every builder this role starts is stamped
              # Role=builder at birth, and every mutate below keys off that stamp
              - Sid: LaunchBuilderTagged
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: craftform
                    aws:RequestTag/Role: builder

              # ======================= the scratch volume =======================
              # the volume the software actually gets installed onto. same tag-at-birth deal
              # as the builder -- untagged means unmanageable, so the bake can't skip it.
              - Sid: CreateScratchVolume
                Effect: Allow
                Action: ec2:CreateVolume
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: craftform
                    aws:RequestTag/Role: builder

              # ======================= snapshot the scratch volume =======================
              # this IS the artifact -- whether it ends up registered as an ami or just
              # mounted as a data volume at launch, the snapshot is what survives the bake.
              #
              # CreateSnapshot authorizes against TWO resource types at once and they need
              # opposite conditions: the snapshot is being born (RequestTag, from
              # --tag-specifications) while the source volume already exists (ResourceTag).
              # one shared condition would happen to work, but only by accident -- split so
              # it's obvious which key is guarding what :)
              - Sid: SnapshotScratchVolume
                Effect: Allow
                Action: ec2:CreateSnapshot
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:snapshot/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: craftform

              - Sid: SnapshotSourceVolume
                Effect: Allow
                Action: ec2:CreateSnapshot
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform
                    aws:ResourceTag/Role: builder

              # ======================= tag on create =======================
              # a brand-new resource has no tags yet, so nothing below can authorize its
              # birth -- chicken n egg, same as the region role's Provision statement. the
              # CreateAction condition is what stops this being "retag anything you like".
              - Sid: TagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - RunInstances
                      - CreateVolume
                      - CreateSnapshot
                      - RegisterImage

              # ======================= drive + wire up the builder =======================
              # attach/detach need the permission to hold on BOTH the volume AND the
              # instance, which is exactly why they share the one Role=builder tag.
              # TerminateInstances is scoped the same way ON PURPOSE -- tagging on
              # Project=craftform alone would let a runaway bake kill a live server :(
              - Sid: ManageBuilder
                Effect: Allow
                Action:
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:DeleteVolume
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform
                    aws:ResourceTag/Role: builder

              # ======================= publish the image =======================
              # RegisterImage turns the finished snapshot into a launchable ami, and
              # DeregisterImage/DeleteSnapshot are the garbage collection -- a rebake of a
              # version we already have needs to clear out the old one, or the account
              # slowly fills up with stale amis nobody launches
              - Sid: PublishImage
                Effect: Allow
                Action:
                  - ec2:RegisterImage
                  - ec2:DeregisterImage
                Resource: arn:aws:ec2:*::image/*

              - Sid: PruneSnapshots
                Effect: Allow
                Action: ec2:DeleteSnapshot
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:snapshot/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform

              # ======================= let the builder be a server =======================
              # the builder runs under the region's own instance profile rather than a new
              # role of its own -- it already carries AmazonSSMManagedInstanceCore, which is
              # what makes SendCommand below work, plus s3 to the world bucket. PassedToService
              # pins it so this can't be used to hand that role to anything but ec2.
              - Sid: PassServerProfile
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/minecraft_server_role_*
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com

              # ======================= run the install =======================
              # SendCommand over ssm instead of stuffing the install into userdata -- userdata
              # runs once, silently, and you find out it failed by noticing the bake produced
              # nothing. this way the build watches the exit code and the output lands in the
              # build log where you can actually read it :)
              - Sid: DriveBuilder
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform
                    aws:ResourceTag/Role: builder

              # the document is a separate arn from the instance, and it's an aws-owned one,
              # so it lives outside our account and can't be tag-scoped
              - Sid: DriveBuilderDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: arn:aws:ssm:*::document/AWS-RunShellScript

              # polling the command we just sent. no arn to scope to -- the command id only
              # exists after the send, so this is '*' by necessity
              - Sid: WatchBuilderCommand
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'

              # ======================= the server record =======================
              # build_env never writes the server's ssm record, so the bake does it at the
              # end -- this is the write that makes the server real to every other subcommand
              - Sid: ServerRecords
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/craftform/*

              # ======================= the discord fallback =======================
              # the interaction token in DISCORD_TOKEN dies 15 minutes after the user hit
              # submit, and a cold bake can absolutely outrun that. when the followup 404s
              # the bot token is the only way left to tell them it worked :)
              - Sid: SecretsRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:craftform-secrets-*

              # ======================= build logs =======================
              # same glob the region role uses -- craftform-* already covers craftform-server
              - Sid: BuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/codebuild/craftform-*:*

  # LAMBDA OPERATION ROLE - the IAM role that the Lambda function will assume
  LambdaOperationRole:
    Type: AWS::IAM::Role
    Properties:
      # tags
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion

      RoleName: craftform-lambda-operation # Name of the IAM role for Lambda operation
      AssumeRolePolicyDocument:
        # who is allowed to assume this role - Lambda service
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com # only Lambda service to assume this role
            Action: sts:AssumeRole

      Policies:
        - PolicyName: craftform-lambda-operation-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # ---- config + state in SSM ----
              # read anything under the craftform path (config, discovery, status)
              - Sid: SsmRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/craftform/*

              # write ONLY the operational subpaths — never the bootstrap config
              - Sid: SsmWrite
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/craftform/servers/*
                  - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/craftform/templates/*
                  - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/craftform/regions/*

              # ---- the Discord bot token, for signature work ----
              - Sid: SecretsRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:craftform-secrets-*

              # ---- the slash commands kick off the long-running builds ----
              # arn is written out by hand instead of !GetAtt so this role doesn't depend on the
              # project resources. wildcarded on craftform-* so /region hits craftform-region and
              # /server hits craftform-server without needing another policy edit -- same trick
              # the log-group statement above already uses :)
              - Sid: StartCraftFormBuilds
                Effect: Allow
                Action: codebuild:StartBuild
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/craftform-*

              # ---- peek into per-region world buckets to check they're empty before a delete ----
              # /region delete blocks teardown if the bucket still holds world data. ListBucket is
              # on the BUCKET arn (not /*), scoped by name to the per-region world buckets.
              - Sid: WorldBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::craftform-*-${AWS::AccountId}

              # ---- /update fires the staging function off async to do the actual heavy lifting ----
              - Sid: InvokeStaging
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:function:craftform-staging-function

              # ---- logging, scoped to this project's own log groups ----
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/craftform-*:*

              # ---- EC2 reads: can't be resource-scoped, must be "*" ----
              - Sid: Ec2Describe
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeSpotInstanceRequests
                  - ec2:DescribeImages
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                Resource: '*'

              # ---- launch: pinned to the m8g family (cost blast-radius control) ----
              - Sid: Ec2Launch
                Effect: Allow
                Action: ec2:RunInstances
                Resource: '*'
                Condition:
                  StringLikeIfExists:
                    ec2:InstanceType: m8g.*

              # ---- server lifecycle: only craftform-tagged instances ----
              - Sid: Ec2Lifecycle
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform

              # ---- AMI bake: create volume/snapshot, must be tagged on create ----
              - Sid: BakeCreate
                Effect: Allow
                Action:
                  - ec2:CreateVolume
                  - ec2:CreateSnapshot
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: craftform

              # ---- AMI bake: manipulate/tear down only craftform-tagged resources ----
              - Sid: BakeManage
                Effect: Allow
                Action:
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:DeleteVolume
                  - ec2:DeleteSnapshot
                  - ec2:DeregisterImage
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: craftform

              # ---- register the AMI: the new image has no prior tag to scope on ----
              - Sid: RegisterImage
                Effect: Allow
                Action: ec2:RegisterImage
                Resource: '*'

              # ---- allow tagging only as part of these create calls ----
              - Sid: TagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - RunInstances
                      - CreateVolume
                      - CreateSnapshot
                      - RegisterImage

              # ---- pass the per-region instance-profile role (Terraform-made) to EC2 ----
              - Sid: PassInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/craftform-*
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com

              # ---- spot's service-linked role, scoped to exactly that role ----
              - Sid: SpotSlr
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/spot.amazonaws.com/AWSServiceRoleForEC2Spot
                Condition:
                  StringEquals:
                    iam:AWSServiceName: spot.amazonaws.com

              # ---- world data in the per-region world buckets ----
              - Sid: WorldData
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - arn:aws:s3:::craftform-minecraft-worlds-*
                  - arn:aws:s3:::craftform-minecraft-worlds-*/*

  # STARTUP ROLE -- used for starting connections and configs in the startup function
  StartupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: craftform-startup
      # tags
      Tags:
        - { Key: Project, Value: craftform }
        - { Key: Environment, Value: HomeRegion }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: craftform-startup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # this role has no SSM access on purpose -- it just reads the secrets bundle and logs
              - Sid: SecretsRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:craftform-secrets-*
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/craftform-*:*

  # STAGER ROLE -- used for staging the Lambda code in S3 before deployment
  StagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: craftform-stager
      # tags
      Tags:
        - { Key: Project, Value: craftform }
        - { Key: Environment, Value: HomeRegion }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        # only let lambda service assume this role
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: craftform-stager-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
                # allow staging objects into the specific S3 bucket -- GetObject is needed because
                # update_function_code pulls the staged zip from S3 using the stager's own creds
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${CraftFormHomeBucket.Arn}/lambda-code/*" # only allow access to the specific S3 bucket and prefix used for staging Lambda code
                # ---- on stack delete we empty the WHOLE bucket so cloudformation can actually drop it ----
                # versioning is on, so we need the version-aware list + delete actions too
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !GetAtt CraftFormHomeBucket.Arn
                  - !Sub "${CraftFormHomeBucket.Arn}/*"
                # /update redeploys both functions and pokes startup to re-register the commands
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:InvokeFunction]
                Resource:
                  - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:craftform-startup-function"
                  - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:craftform-operation-function"
              # allow creating log groups and streams.
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/craftform-*:*"
 
  # ------------------------------------------S3 STATE BUCKET------------------------------------------
  CraftFormHomeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete # delete the bucket when the stack is deleted
    Properties:
      # globally unique name for the S3 bucket
      BucketName: !Sub craftform-home-${AWS::AccountId}
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion

      # enable versioning to keep track of changes to the Terraform state files
      VersioningConfiguration:
        Status: Enabled

      # block public access to the bucket for security
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true # prevent public ACLs from being set on the bucket or objects within the bucket
        BlockPublicPolicy: true # prevent public bucket policies from being applied to the bucket
        IgnorePublicAcls: true # ignore any public ACLs
        RestrictPublicBuckets: true # say no no to any public access to the bucket

  # -------------------------------------------SECRET MANGER-------------------------------------------
  # holds sensitive information like the Discord bot token, which is needed for the
  # craftForm bot to operate

  CraftFormSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: craftform-secrets
      Description: Secrets for CraftForm application, including Discord credentials.
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion

      SecretString: !Sub '{"Discord-Bot-Token": "${DiscordBotToken}"}'

  # -------------------------------------------SSM PARAMETERS------------------------------------------
  # HOME REGION PARAMETER
  HomeRegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /craftform/config/home-region
      Type: String
      Value: !Sub ${AWS::Region} # set the value of the home region parameter
      Description: Home AWS region for CraftForm
      Tags:
        Project: craftform
        Environment: HomeRegion

  # DISCORD PARAMETERS:
  DiscordAppIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /craftform/config/discord/app-id
      Type: String
      Value: !Ref DiscordAppId
      Description: Discord Application ID for CraftForm bot
      Tags:
        Project: craftform
        Environment: HomeRegion

  DiscordPublicKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /craftform/config/discord/public-key
      Type: String
      Value: !Ref DiscordPublicKey
      Description: Discord Public Key for CraftForm bot
      Tags:
        Project: craftform
        Environment: HomeRegion

  # STATE FILE PARAMETERS:
  S3StateBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /craftform/config/terraform/state-bucket
      Type: String
      Value: !Ref CraftFormHomeBucket
      Description: Name of the S3 bucket for Terraform state files
      Tags:
        Project: craftform
        Environment: HomeRegion

  # API GATEWAY PARAMETER:
  APIGatewayEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /craftform/config/api-gateway/endpoint/discord
      Type: String
      Value: !Sub https://${DiscordApiGateway}.execute-api.${AWS::Region}.amazonaws.com/discord # construct the API Gateway endpoint URL using the API ID and region
      Description: API Gateway endpoint URL for CraftForm bot interactions
      Tags:
        Project: craftform
        Environment: HomeRegion

  # SECRETS MANAGER PARAMETERS:
  CraftFormSecretsArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /craftform/config/secrets/arn
      Type: String
      Value: !Ref CraftFormSecrets # get the ARN of the Secrets Manager secret
      Description: ARN of the Secrets Manager secret that holds CraftForm secrets
      Tags:
        Project: craftform
        Environment: HomeRegion

  # --------------------------------------------API GATEWAY--------------------------------------------
  DiscordApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CraftFormDiscordAPI
      Description: API Gateway for handling Discord interactions with the CraftForm
        Discord bot.
      Tags:
        Project: craftform
        Environment: HomeRegion
      ProtocolType: HTTP # Use HTTP API for lower latency and simpler setup

  # INTEGRATION - what connects the Gateway to the resource (Lambda function)
  DiscordApiGatewayIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DiscordApiGateway
      IntegrationType: AWS_PROXY # Use AWS_PROXY to integrate directly with the Lambda function
      # route all requests from the API Gateway to the OperationFunction Lambda
      IntegrationUri: !GetAtt OperationFunction.Arn
      PayloadFormatVersion: '2.0' # use latest HTTP payload format

  # ROUTE - basically a router for certain inputs that the Gateway receives and calls an integration
  DiscordApiGatewayRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DiscordApiGateway
      RouteKey: POST /discord # route for handling Discord interactions - only POST requests
      Target: !Sub integrations/${DiscordApiGatewayIntegration} # target the integration

  # STAGE - gives a stable and clean URL for the Gateway that Discord can hit
  DiscordApiGatewayStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DiscordApiGateway
      StageName: $default # gives a default stage for the API Gateway - stable and clean URL
      AutoDeploy: true # automatically deploy changes to the API Gateway

  # PERMISSION - allow the Gateway to invoke the Lambda function
  DiscordApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OperationFunction # what function the gatewau is allowed to invoke
      Action: lambda:InvokeFunction # what action the gateway is allowed to do to the function - invoke it
      Principal: apigateway.amazonaws.com # who is allowed to do the action - API Gateway service
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DiscordApiGateway}/*/* # only allow this specific API Gateway to invoke
  # ------------------------------------------CODE BUILD-----------------------------------------
  # REGION CODEBUILD PROJECT - runs terraform to deploy/tear down region infrastructure.
  # the server bake gets its OWN project (craftform-server) -- different tooling, different
  # iam, and a server build shouldn't sit in queue behind a region deploy :)
  CodeBuildRegion:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - StageCodeTrigger
    Properties:
      Name: craftform-region
      Description: CodeBuild project to run Terraform for CraftForm region deployments.
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion
      ServiceRole: !GetAtt CodeBuildRegionRole.Arn # the role the build runs under

      Environment:
        Type: LINUX_CONTAINER # use a Linux container for the build environment
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL # small compute type for cost efficiency
        EnvironmentVariables:
          - Name: HOME_REGION
            Value: !Ref AWS::Region # set the default AWS region for the build environment
          - Name: STATE_BUCKET
            Value: !Ref CraftFormHomeBucket # pass the S3 bucket name to the build environment
      Source:
        Type: S3 # source code comes from S3 (the staged terraform.zip)
        Location: !Sub ${CraftFormHomeBucket}/lambda-code/terraform.zip # location of the staged terraform.zip in S3
        BuildSpec: buildspec.yaml
      ConcurrentBuildLimit: 1 # limit to one concurrent build to avoid race conditions
      TimeoutInMinutes: 10 # set a timeout in case it stalls or takes too long
      Artifacts:
        Type: NO_ARTIFACTS # no artifacts are produced by this build

  # -----------------------------------------LAMBDA FUNCTIONS------------------------------------------
  # STAGING LAMBDA FUNCTION - used to stage the code for the other lambda function in S3 before deployment.
  StagingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: craftform-staging-function
      Description: Lambda function to stage code for the other Lambda functions in S3 before deployment.
      Tags:
        - { Key: Project, Value: craftform }
        - { Key: Environment, Value: HomeRegion }
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256 # give it a bit more memory for faster staging
      Role: !GetAtt StagerRole.Arn
      # the /update path needs to know where to stash the zips
      Environment:
        Variables:
          Bucket: !Ref CraftFormHomeBucket
      Code:
        ZipFile: |
          # ==================IMPORTS=================
          import urllib.request, json, os, boto3
          import cfnresponse

          # ================AWS CLIENT================
          s3 = boto3.client('s3')  # used by stage_assets, which BOTH the /update and cloudformation paths call - so it stays global

          # the release assets we stage -- the two lambda zips, plus the terraform source
          # that the codebuild project pulls down at the start of every region run
          assets = ['startup.zip', 'operations.zip', 'terraform.zip']
          base = "https://github.com/Liamade/CraftForm/releases"

          # ================CODE STAGING FUNCTION================
          def stage_assets(bucket, version):

            # latest has a different url shape than a pinned version like v1.2.3
            url = f"{base}/latest/download" if version == 'latest' else f"{base}/download/{version}"

            for asset in assets:
              download = urllib.request.urlopen(f"{url}/{asset}").read()  # grab the zip
              s3.put_object(Bucket=bucket, Key=f"lambda-code/{asset}", Body=download)

          # ================BUCKET EMPTYING FUNCTION================
          # cloudformation refuses to delete a non-empty bucket, so on stack delete we wipe it ourselves.
          # versioning is on, so we have to clear every version AND every delete marker
          def empty_bucket(bucket):
            pages = s3.get_paginator('list_object_versions').paginate(Bucket=bucket)
            for page in pages:
              # both versions and delete markers count as "stuff in the bucket" we need gone
              objects = [{'Key': o['Key'], 'VersionId': o['VersionId']} for o in page.get('Versions', []) + page.get('DeleteMarkers', [])]
              if objects:
                s3.delete_objects(Bucket=bucket, Delete={'Objects': objects})

          # ================FOLLOWUP FUNCTION================
          # sends a message to discord to tell it that the process is done -- for /update function
          def followup(app_id, token, message):
            webhook = f"https://discord.com/api/v10/webhooks/{app_id}/{token}/messages/@original"

            req = urllib.request.Request(
              webhook,
              data=json.dumps({"content": message}).encode(),
              # discord sits behind cloudflare which 403s the default Python-urllib UA -- any real UA works, contents don't matter
              headers={"Content-Type": "application/json", "User-Agent": "CraftForm-Bot/1.0"},
              method="PATCH",  # editing the existing deferred message, not posting a fresh one
            )

            urllib.request.urlopen(req)

          # ================UPDATE FUNCTION================
          # the /update flow: restage the assets, redeploy the lambdas, refresh commands, then tell discord we're done
          def handle_update(event):
            # -------------------------------AWS CLIENTS------------------------------
            lambdaClient = boto3.client('lambda')
            # ---------------------------INJECTED VARIABLES---------------------------
            app_id = event['application_id']  # so we can edit the user's "thinking..." message
            token = event['interaction_token']  # the token for THIS interaction

            # -----------------------------MAIN EXECUTION-----------------------------
            try:
              # VARIABLES -- stay as os variables after the first run so we can call them again
              bucket = os.environ['Bucket']  # the home craftform bucket

              # ---------------------------LATEST RELEASE CODE---------------------------
              # pulls all three assets -- both lambda zips AND the terraform source, so a
              # region deploy after an /update runs the new terraform too :)
              stage_assets(bucket, 'latest') # calls the original stage_assets function with just the latest

              # UPDATE THE LAMBDA -- update the current lambdas with the new code that got pulled
              lambdaClient.update_function_code(FunctionName='craftform-startup-function', S3Bucket=bucket, S3Key='lambda-code/startup.zip')
              lambdaClient.update_function_code(FunctionName='craftform-operation-function', S3Bucket=bucket, S3Key='lambda-code/operations.zip')

              # wait for startup to finish waiting -- is used because it is called later
              lambdaClient.get_waiter('function_updated_v2').wait(FunctionName='craftform-startup-function')

              # ---------------------------STARTUP FUNCTION---------------------------
              # we re-run the startup function because it has to reregister potentially new discord commands
              register = lambdaClient.invoke(
                FunctionName='craftform-startup-function',
                InvocationType='RequestResponse',  # wait on it so we only tell the user "done" once it actually worked
                Payload=json.dumps({"action": "register_commands"}).encode(),
              )

              if register.get('FunctionError'):  # check and see if the wrapper has FunctionError in the response
                raise Exception(register['Payload'].read().decode())

              followup(app_id, token, "CraftForm is updated, goodjob!! <3")

            except Exception as e:
              print(f"Error updating CraftForm :( : {e}")
              followup(app_id, token, f"Update failed :( : {e}")

          # ================MAIN HANDLER===================
          def handler(event, context):

            # ============UPDATE EVENT============
            # /update fires this lambda async - hand it off to the update function and bail
            if event.get('action') == 'update':
              handle_update(event)
              return  # nothing waits on this return - we already told the user via the webhook

            # ===== cloudformation custom resource (stack create/update/delete) =====
            try:

              if event['RequestType'] != 'Delete':

                # stage the lambda code in S3 from the release so the other functions can boot off it
                envVar = event['ResourceProperties']
                stage_assets(envVar['Bucket'], envVar['Version'])

              else:
                # stack teardown - this resource dies before the bucket does, so empty it now
                # while it still exists, otherwise cloudformation chokes on the non-empty bucket
                empty_bucket(event['ResourceProperties']['Bucket'])

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})


            except Exception as e:
              print(f"Error staging Lambda code: {e} :(")
              cfnresponse.send(event, context, cfnresponse.FAILED, {})
              print(f"Error staging Lambda code: {e} :(")
              cfnresponse.send(event, context, cfnresponse.FAILED, {})
              
          
  # Lambda function for startup tasks -  gets triggered when the stack is created
  StartUpFunction:
    Type: AWS::Lambda::Function
    DependsOn: StageCodeTrigger # ensure the code is staged before creating the Lambda
    Properties:
      FunctionName: craftform-startup-function
      Description: Lambda function to perform startup tasks for CraftForm, such as
        registering commands to discord
      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion

      # Variables
      Environment:
        Variables:
          ApiGatewayUrl: !Sub https://${DiscordApiGateway}.execute-api.${AWS::Region}.amazonaws.com/discord
          DiscordAppId: !Ref DiscordAppId
          Region: !Ref AWS::Region
          HomeBucket: !Ref CraftFormHomeBucket
          # NOTE: the Discord bot token is NOT injected here on purpose -- the function
          # fetches it from Secrets Manager at runtime so it never appears in the config

      Timeout: 120 # set a longer timeout for the startup function
      Runtime: python3.12 # runtime for the Lambda function
      Handler: index.handler # handler for the Lambda function
      Role: !GetAtt StartupRole.Arn # operation role for the Lambda function
      Code:
        S3Bucket: !Ref CraftFormHomeBucket # use the staged code in S3
        S3Key: lambda-code/startup.zip

  # Lambda function for handling all operations for CraftForm - basically the main function
  OperationFunction:
    Type: AWS::Lambda::Function
    DependsOn: StageCodeTrigger # ensure the code is staged before creating the Lambda

    Properties:
      FunctionName: craftform-operation-function
      Description: Lambda function to handle operations for CraftForm, such as
        handling Discord interactions and executing Terraform commands

      Tags:
        - Key: Project
          Value: craftform
        - Key: Environment
          Value: HomeRegion
      Timeout: 30 # timeout for the operation function - basically just to trigger a workflow
      Runtime: python3.12 # runtime for the Lambda function
      Handler: index.handler # handler for the Lambda function
      Role: !GetAtt LambdaOperationRole.Arn # operation role for the Lambda function
      Code:
        S3Bucket: !Ref CraftFormHomeBucket # use the staged code in S3
        S3Key: lambda-code/operations.zip

  # ------------------------------------------RESOURCE TRIGGER-----------------------------------------

  # CUSTOM STAGE CODE RESOURCE - trigger the staging Lambda function to stage the code in S3 before creating the other functions
  StageCodeTrigger:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt StagingFunction.Arn # the lambda function to run
      Bucket: !Ref CraftFormHomeBucket # the S3 bucket to stage the code in
      Version: !Ref CraftFormVersion    # the version of the code to stage

  # CUSTOM STARTUP RESOURCE - trigger the startup Lambda function to preform connections
  StartupTrigger:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:    # make sure the API Gateway and it's components are created before running the startup function
      - DiscordApiGateway
      - DiscordApiGatewayIntegration
      - DiscordApiGatewayRoute
      - DiscordApiGatewayStage
      - DiscordApiGatewayPermission
      - OperationFunction
      # setting the endpoint makes discord immediately PING it, and the operation function reads
      # the public key out of ssm to verify that ping -- so the param HAS to exist first. nothing
      # references it, so without this cloudformation is free to build it in parallel and we lose
      # the race on some deploys and not others :(
      - DiscordPublicKeyParameter
    Properties:
      ServiceToken: !GetAtt StartUpFunction.Arn # run this function after the stack is created