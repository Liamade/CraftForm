#╔══════════════════════════════════════════════════════════════════════════════╗
#║                               CraftForm                                      ║
#╠══════════════════════════════════════════════════════════════════════════════╣
#║  CODEBUILD  ::  buildspec.yaml                                               ║
#║  Runs Terraform to create or destroy a region, then reports to Discord.      ║
#║  This is what replaced the old tf-deploy-region.yaml workflow.               ║
#║                                                                              ║
#║  Rides at the ROOT of terraform.zip so it always versions together with the  ║
#║  terraform it runs. Codebuild only auto-finds "buildspec.yml", so the        ║
#║  project has to point at this one by name -> BuildSpec: buildspec.yaml       ║
#╚══════════════════════════════════════════════════════════════════════════════╝

version: 0.2   # the buildspec format version, not ours

#============================================================
#                 VARIABLE SETTINGS
#============================================================
# BAKED IN -- right here, same every run
#   TF_VERSION        the terraform version to install
#
# SET ON THE PROJECT -- cloudformation writes these once
#   HOME_REGION       control-plane region (where state + ssm live)
#   STATE_BUCKET      the home bucket holding the terraform state
#
# INJECTED PER RUN -- the operations lambda passes these to start_build
#   DEPLOY_REGION     the region we're building INTO
#   TF_ACTION         create or destroy
#   DISCORD_APP_ID    the bot id, for the followup webhook
#   DISCORD_TOKEN     the interaction token, so we edit the RIGHT message

env:
  variables:
    TF_VERSION: "1.11.4"   # bump here to upgrade terraform
    TF_IN_AUTOMATION: "1"  # tells terraform nobody's watching, so don't prompt

#============================================================
#                 BUILD EXECUTION
#============================================================
# runs in order: install -> build -> post_build.
# if install or build dies it jumps STRAIGHT to post_build -- that's the only
# reason the discord reporting works when terraform fails :)

phases:

 # ----------------------------------------------------------
 #                        SETUP
 # ----------------------------------------------------------
  install:
    commands:

    # =======================DOWNLOAD TERRAFORM=======================
    # the image doesn't ship terraform, so we grab it -- github's setup-terraform did this for us
    - curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"   # -f die on a 404, -s quiet, -S but show errors, -L follow redirects

    # ========================VERIFY TERRAFORM========================
    # the sums file hashicorp publishes next to every release
    - curl -fsSL -o /tmp/terraform_SHA256SUMS "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"

    # NOTE: can't pipe this into `sha256sum -c` -- it reads the FILENAME out of the sums
    # file and hunts for it in the current dir. ours is /tmp/terraform.zip, so it'd miss
    - |
      EXPECTED=$(grep "terraform_${TF_VERSION}_linux_amd64.zip" /tmp/terraform_SHA256SUMS | awk '{print $1}')   # our platform's line, $1 = the hash
      ACTUAL=$(sha256sum /tmp/terraform.zip | awk '{print $1}')                                                 # hash what we actually got
      echo "expected: $EXPECTED"   # print both so a failure says WHAT didn't match
      echo "actual:   $ACTUAL"
      if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then   # if the expected hash or if the actual hash doesn't match = no beuno
        echo "terraform checksum did NOT match, refusing to install it :("
        exit 1   # kills the phase -> post_build still tells discord
      fi
      echo "checksum matches :)"

    # ========================INSTALL TERRAFORM=======================
    - unzip -oq /tmp/terraform.zip -d /usr/local/bin && chmod +x /usr/local/bin/terraform   # into a dir already on PATH. -o overwrite, -q quiet, -d where to
    - terraform version   # smoke test -- if this prints, the binary's good

 # ----------------------------------------------------------
 #                      TERRAFORM
 # ----------------------------------------------------------
 # codebuild already unzipped terraform.zip and dropped us inside it, so main.tf
 # is sitting right here -- no checkout and no cd needed :)
 #
 # HEADS UP: every command below gets its OWN shell, so `cd` and `export` don't
 # carry over. anything sharing state has to live in one `- |` block. the
 # filesystem does persist though, which is how tfplan survives to the apply
  build:
    commands:

    # =========================TERRAFORM INIT=========================
    # the backend block in terraform.tf is left EMPTY on purpose, so these get injected per
    # run -- that's how one set of terraform code manages every region off its own state file
    - |
      terraform init -input=false -no-color -lock-timeout=60s \
        -backend-config="bucket=${STATE_BUCKET}" \
        -backend-config="key=regions/${DEPLOY_REGION}/terraform.tfstate" \
        -backend-config="region=${HOME_REGION}"
      # -input=false never prompt (nobody's here) | -no-color ANSI is garbage in cloudwatch
      # -lock-timeout wait a min for the state lock instead of dying -- two /region's back to back
      # bucket = state storage | key = per-region object path | region = where the bucket lives

    # =========================TERRAFORM PLAN=========================
    - |
      FLAG=''     # simple flag based on if the run is a destroy or a create
      if [ "$TF_ACTION" = "destroy" ]; then FLAG='-destroy'; fi
      terraform plan $FLAG -out=tfplan -input=false -no-color \
        -var="region=${DEPLOY_REGION}" \
        -var="home_region=${HOME_REGION}"
      # $FLAG UNQUOTED on purpose -- quoted, an empty one becomes an empty arg and terraform chokes
      # -out saves the plan so apply does EXACTLY this, no re-deciding
      # -var passed straight in, since exports don't survive to the next command

    # ========================TERRAFORM APPLY=========================
    - terraform apply -input=false -no-color tfplan   # the SAVED plan, so no -var needed -- already baked in

 # ----------------------------------------------------------
 #                   DISCORD RESPONSE
 # ----------------------------------------------------------
 # runs even if terraform FAILED -- that's exactly when we need to report.
 # the user is sat there staring at the "thinking..." spinner either way
  post_build:
    commands:

    # ==========================REPORT BACK===========================
    - |
      if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then   # codebuild sets this -- 1 = fine, 0 = something broke
        MESSAGE="Region \`$DEPLOY_REGION\` was ${TF_ACTION}d successfully. :)"   # ${TF_ACTION}d -> "created" / "destroyed". backticks = discord code formatting
      else
        MESSAGE="Something went wrong while trying to $TF_ACTION region \`$DEPLOY_REGION\`. Check the build logs. :("
      fi

      # the @original endpoint edits the deferred "thinking..." message we left the user on.
      # no auth header -- the token IN the url is the credential, which is why it dies in 15 min
      curl -sS -X PATCH \
        "https://discord.com/api/v10/webhooks/${DISCORD_APP_ID}/${DISCORD_TOKEN}/messages/@original" \
        -H "Content-Type: application/json" \
        -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')"   # jq builds the json so a quote in MESSAGE can't break it
